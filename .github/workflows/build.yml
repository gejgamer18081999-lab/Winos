name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  ui-stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q WinOS.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: WinOS
      - uses: actions/upload-artifact@v4
        with:
          name: WinOS-stage1-ui
          path: WinOS/app/build/outputs/apk/debug/*.apk
  winos-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q WinOS.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash WinOS/ci/build_winos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WinOS-runtime-apk
          path: WinOS/out/*.apk
