name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q WinOS.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: WinOS
      - uses: actions/upload-artifact@v4
        with:
          name: WinOS-debug-apk
          path: WinOS/app/build/outputs/apk/debug/*.apk
  winlator-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Clone Winlator 11.2
        run: git clone --depth 1 --branch v11.2.0 --recurse-submodules --shallow-submodules https://github.com/brunodev85/winlator.git src
      - name: Install SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null
      - name: Build Winlator
        working-directory: src/app
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Winlator-check-apk
          path: src/app/app/build/outputs/apk/debug/*.apk
