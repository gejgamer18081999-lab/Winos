name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  winos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q WinOS.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash WinOS/ci/build_winos.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
